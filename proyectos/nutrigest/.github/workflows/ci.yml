name: NutriGest CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nutrigest
          POSTGRES_USER: nutrigest
          POSTGRES_PASSWORD: ci-only-database-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nutrigest -d nutrigest"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NUTRIGEST_TEST: "1"
      POSTGRES_PASSWORD: ci-only-database-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.lock.txt
      - run: python backend/manage.py check
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py test clinic
      - run: python -m unittest discover -s tests -v
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
